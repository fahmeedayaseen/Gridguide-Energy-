name: Generate Prisma baseline (one-time)

# Generates prisma/migrations/0_init/migration.sql from the schema as it was
# BEFORE the P0 changes (commit 22fe0dd), using Prisma's own SQL generator, and
# commits it to the branch. Runs only while that file is missing; after it's
# committed this workflow does nothing. Safe to delete once 0_init exists.

on:
  push:
    paths:
      - ".github/workflows/generate-baseline.yml"
      - "prisma/migrations/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if baseline already exists
        id: check
        run: |
          if [ -f prisma/migrations/0_init/migration.sql ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=baseline::0_init already present — nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22

      - name: Install Prisma CLI (pinned to the project version)
        if: steps.check.outputs.exists == 'false'
        run: npm install --no-save --no-audit --no-fund prisma@5.14.0

      - name: Generate 0_init from the pre-P0 schema
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          mkdir -p /tmp/base prisma/migrations/0_init
          cp prisma/migrations_archive/schema-at-0_init.prisma /tmp/base/schema.prisma
          {
            echo "-- Baseline: full GridGuide schema as of commit 22fe0dd (before the Oct 2026 P0 changes)."
            echo "-- Generated by Prisma (migrate diff --from-empty). Replaces the old partial migration chain,"
            echo "-- which assumed tables originally created with 'prisma db push' (see prisma/migrations_archive/)."
            echo
            npx prisma migrate diff --from-empty --to-schema-datamodel /tmp/base/schema.prisma --script
          } > prisma/migrations/0_init/migration.sql
          echo "::notice title=baseline::generated $(wc -l < prisma/migrations/0_init/migration.sql) lines"

      - name: Commit baseline
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/0_init/migration.sql
          git commit -m "Add Prisma 0_init baseline (generated by CI from pre-P0 schema)"
          git push
